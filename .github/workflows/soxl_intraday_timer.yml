name: Run SOXL Intraday Bot

on:
  schedule:
    # SOXL intraday bot runs every 30 minutes from 10:15am to 3:00pm ET,
    # then a tighter 3:20pm run before the 3:35pm time stop.
    # Total: 12 runs per day.
    #
    # WHY EVERY 30 MINUTES:
    #   Each run scores the last completed 15-minute bar. Running every 30 min
    #   means every second 15-min bar gets scored. This is the best balance
    #   between coverage and GitHub Actions free-tier usage (~528 min/month).
    #
    # WHY START AT 10:15am:
    #   The Opening Range is established at 10:00am (first 30 min of trading).
    #   The 10:15am run scores the very first bar after the opening range closes
    #   (10:00-10:15am) — often where the strongest ORB breakouts happen.
    #   The 10:30am run catches the second bar if the breakout needed confirmation.
    #
    # WHY 3:20pm INSTEAD OF 3:30pm:
    #   Time stop fires at 3:35pm ET. The 3:20pm run gives the bot time to
    #   detect an open position and send the exit alert before 3:35pm.
    #
    # Bot's internal time gates handle edge cases:
    #   - Before 10:00am: no signals (opening range incomplete)
    #   - After 3:35pm:  no new buy signals (time stop gate active)
    #   - Market closed:  bot exits immediately with no action
    #
    # DST handled with dual UTC offsets (same pattern as tqqq_timer.yml):
    #   EDT (Mar-Nov): UTC-4  |  EST (Nov-Mar): UTC-5
    #   Running both offsets means exactly one fires correctly each season.
    #   The bot's internal market hours gate rejects any run outside 9:30am-3:45pm ET.
    #
    # Run schedule with UTC conversions:
    #   ET Time  | EDT (UTC-4) | EST (UTC-5)
    #   10:15am  | 14:15 UTC   | 15:15 UTC
    #   10:30am  | 14:30 UTC   | 15:30 UTC
    #   11:00am  | 15:00 UTC   | 16:00 UTC
    #   11:30am  | 15:30 UTC   | 16:30 UTC
    #   12:00pm  | 16:00 UTC   | 17:00 UTC
    #   12:30pm  | 16:30 UTC   | 17:30 UTC
    #   1:00pm   | 17:00 UTC   | 18:00 UTC
    #   1:30pm   | 17:30 UTC   | 18:30 UTC
    #   2:00pm   | 18:00 UTC   | 19:00 UTC
    #   2:30pm   | 18:30 UTC   | 19:30 UTC
    #   3:00pm   | 19:00 UTC   | 20:00 UTC
    #   3:20pm   | 19:20 UTC   | 20:20 UTC

    # ── EDT offsets (March - November) ──────────────────────────────────────
    - cron: '15 14 * * 1-5'   # 10:15am ET (EDT)
    - cron: '30 14 * * 1-5'   # 10:30am ET (EDT)
    - cron: '0  15 * * 1-5'   # 11:00am ET (EDT)
    - cron: '30 15 * * 1-5'   # 11:30am ET (EDT)
    - cron: '0  16 * * 1-5'   # 12:00pm ET (EDT)
    - cron: '30 16 * * 1-5'   # 12:30pm ET (EDT)
    - cron: '0  17 * * 1-5'   #  1:00pm ET (EDT)
    - cron: '30 17 * * 1-5'   #  1:30pm ET (EDT)
    - cron: '0  18 * * 1-5'   #  2:00pm ET (EDT)
    - cron: '30 18 * * 1-5'   #  2:30pm ET (EDT)
    - cron: '0  19 * * 1-5'   #  3:00pm ET (EDT)
    - cron: '20 19 * * 1-5'   #  3:20pm ET (EDT)

    # ── EST offsets (November - March) ──────────────────────────────────────
    - cron: '15 15 * * 1-5'   # 10:15am ET (EST)
    - cron: '30 15 * * 1-5'   # 10:30am ET (EST)
    - cron: '0  16 * * 1-5'   # 11:00am ET (EST)
    - cron: '30 16 * * 1-5'   # 11:30am ET (EST)
    - cron: '0  17 * * 1-5'   # 12:00pm ET (EST)
    - cron: '30 17 * * 1-5'   # 12:30pm ET (EST)
    - cron: '0  18 * * 1-5'   #  1:00pm ET (EST)
    - cron: '30 18 * * 1-5'   #  1:30pm ET (EST)
    - cron: '0  19 * * 1-5'   #  2:00pm ET (EST)
    - cron: '30 19 * * 1-5'   #  2:30pm ET (EST)
    - cron: '0  20 * * 1-5'   #  3:00pm ET (EST)
    - cron: '20 20 * * 1-5'   #  3:20pm ET (EST)

  workflow_dispatch:
    inputs:
      force:
        description: 'Force scan even if market is closed (testing)'
        required: false
        default: 'false'
        type: boolean
      dry_run:
        description: 'Dry run — skip trade log writes (testing)'
        required: false
        default: 'false'
        type: boolean

jobs:
  soxl_intraday:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SOXL intraday bot
        env:
          DISCORD_URL: ${{ secrets.DISCORD_URL }}
        run: |
          ARGS=""
          [ "${{ github.event.inputs.force }}"   = "true" ] && ARGS="$ARGS --force"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python soxl_intraday_bot.py $ARGS

      - name: Commit trade logs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Initialise log files if they don't exist yet
          [ -f soxl_intraday_trade_log.json ] || echo "[]" > soxl_intraday_trade_log.json
          [ -f soxl_gate_blocks.json ]         || echo "[]" > soxl_gate_blocks.json

          git add soxl_intraday_trade_log.json soxl_gate_blocks.json

          git diff --staged --quiet || (
            git commit -m "chore: update soxl intraday trade log [skip ci]" &&
            git pull --rebase origin master &&
            git push
          )
