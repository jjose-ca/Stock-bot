name: Run SOXL Intraday Bot

on:
  schedule:
    # SOXL intraday bot runs every 15 minutes from 10:00am to 3:20pm ET.
    # Compact multi-value cron syntax covers both EDT and EST seasons.
    #
    # WHY EVERY 15 MINUTES:
    #   GitHub Actions drops ~50% of scheduled runs under load (confirmed
    #   from TQQQ bot run history). Scheduling every 15 min delivers
    #   effective ~30 min coverage — the right balance for 15-min bar signals.
    #
    # WHY 10:00am START:
    #   Opening Range closes at 10:00am. The 10:00-10:15am bar is the
    #   first ORB bar and often the strongest. Starting at 10:00am UTC
    #   (14:00 EDT) catches it immediately.
    #
    # WHY 3:20pm END:
    #   Time stop fires at 3:35pm ET. The 3:20pm run detects open
    #   positions and sends exit alerts with time to act.
    #
    # DST handled with dual UTC offsets:
    #   EDT (Mar-Nov): UTC-4  |  EST (Nov-Mar): UTC-5
    #   17 of 27 entries are shared (serve both seasons correctly).
    #   Bot's internal market hours gate rejects any off-hours fires.
    #
    # Run schedule:
    #   ET Time          | EDT (UTC-4) | EST (UTC-5)
    #   10:00am-2:45pm   | 14:00-18:45 | 15:00-19:45
    #   3:00pm + 3:20pm  | 19:00+19:20 | 20:00+20:20

    # EDT (March - November) — every 15 min, 10:00am to 3:20pm
    - cron: '0,15,30,45 14-18 * * 1-5'   # 10:00am-2:45pm ET (EDT)
    - cron: '0,20 19 * * 1-5'             # 3:00pm + 3:20pm ET (EDT)

    # EST (November - March) — every 15 min, 10:00am to 3:20pm
    - cron: '0,15,30,45 15-19 * * 1-5'   # 10:00am-2:45pm ET (EST)
    - cron: '0,20 20 * * 1-5'             # 3:00pm + 3:20pm ET (EST)

  workflow_dispatch:
    inputs:
      force:
        description: 'Force scan even if market is closed (testing)'
        required: false
        default: 'false'
        type: boolean
      dry_run:
        description: 'Dry run — skip trade log writes (testing)'
        required: false
        default: 'false'
        type: boolean

jobs:
  soxl_intraday:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SOXL intraday bot
        env:
          DISCORD_URL: ${{ secrets.DISCORD_URL }}
        run: |
          ARGS=""
          [ "${{ github.event.inputs.force }}"   = "true" ] && ARGS="$ARGS --force"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python soxl_intraday_bot.py $ARGS

      - name: Commit trade logs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          [ -f soxl_intraday_trade_log.json ] || echo "[]" > soxl_intraday_trade_log.json
          [ -f soxl_gate_blocks.json ]         || echo "[]" > soxl_gate_blocks.json

          git add soxl_intraday_trade_log.json soxl_gate_blocks.json

          git diff --staged --quiet || (
            git commit -m "chore: update soxl intraday trade log [skip ci]" &&
            git pull --rebase origin master &&
            git push
          )
