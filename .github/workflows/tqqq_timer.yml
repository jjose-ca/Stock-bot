name: Run TQQQ Bot

on:
  schedule:
    # All times target ET market hours. GitHub Actions cron runs in UTC.
    # DST is handled by running BOTH UTC offsets year-round — the bot's
    # internal market-hours gate (elapsed_minutes check) rejects any run
    # that fires outside 9:30am-4:00pm ET, so duplicate fires are harmless.
    #
    # EDT (Mar-Nov): UTC-4  |  EST (Nov-Mar): UTC-5
    # Running both offsets means exactly one fires correctly each season.
    #
    # TQQQ bot runs every 15 minutes all session (vs hourly for stock_bot).
    # Reason: real-time sell alerts (stop/target/trail) need frequent checks
    # to fire promptly during the session. A 1-hour gap is too coarse for
    # a 3x leveraged ETF that can move 5%+ within a single hour.

    # Every 15 min, 9:30am-3:45pm ET
    #   EDT -> 13:30-19:45 UTC  |  EST -> 14:30-20:45 UTC
    - cron: '30,45 13 * * 1-5'
    - cron: '0,15,30,45 14-18 * * 1-5'
    - cron: '0,15,30,45 19 * * 1-5'
    - cron: '30,45 14 * * 1-5'
    - cron: '0,15,30,45 15-19 * * 1-5'
    - cron: '0,15,30,45 20 * * 1-5'

  workflow_dispatch:
    inputs:
      force:
        description: 'Force scan even if market is closed (for testing)'
        required: false
        default: 'false'
        type: boolean
      dry_run:
        description: 'Dry run — skip order placement (safe for testing)'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run TQQQ bot
        env:
          DISCORD_URL: ${{ secrets.DISCORD_URL }}
          # ALPACA_API_KEY and ALPACA_SECRET_KEY removed — bot migrated to IBKR.
          # Re-add these secrets here if reverting to Alpaca paper trading.
        run: |
          ARGS=""
          [ "${{ github.event.inputs.force }}"   = "true" ] && ARGS="$ARGS --force"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python tqqq_bot.py $ARGS

      - name: Commit trade log
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f trade_log.json ]      || echo "[]" > trade_log.json
          [ -f earnings_cache.json ] || echo "{}" > earnings_cache.json
          git add trade_log.json earnings_cache.json
          git diff --staged --quiet || (
            git commit -m "chore: update trade log [skip ci]" &&
            git pull --rebase origin master &&
            git push
          )
