name: Run Stock Bot

on:
  schedule:
    # All times target ET market hours. GitHub Actions cron runs in UTC.
    # DST is handled by running BOTH UTC offsets year-round — the bot's
    # internal market-hours gate (elapsed_minutes check) rejects any run
    # that fires outside 9:30am-4:00pm ET, so duplicate fires are harmless.
    #
    # EDT (Mar-Nov): UTC-4  |  EST (Nov-Mar): UTC-5
    # Running both offsets means exactly one fires correctly each season.

    # Intraday: every hour at :00, 10:00am-2:00pm ET
    #   EDT -> 14:00-18:00 UTC  |  EST -> 15:00-19:00 UTC
    - cron: '0 14-18 * * 1-5'
    - cron: '0 15-19 * * 1-5'

    # Power Hour: 3:00, 3:15, 3:30, 3:45pm ET
    #   EDT -> 19:00-19:45 UTC  |  EST -> 20:00-20:45 UTC
    - cron: '0 19 * * 1-5'
    - cron: '15 19 * * 1-5'
    - cron: '30 19 * * 1-5'
    - cron: '45 19 * * 1-5'
    - cron: '0 20 * * 1-5'
    - cron: '15 20 * * 1-5'
    - cron: '30 20 * * 1-5'
    - cron: '45 20 * * 1-5'

  workflow_dispatch:
    inputs:
      force:
        description: 'Force scan even if market is closed (for testing)'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          DISCORD_URL: ${{ secrets.DISCORD_URL }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python stock_bot.py ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Commit trade log
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f trade_log.json ] || echo "[]" > trade_log.json
          [ -f earnings_cache.json ] || echo "{}" > earnings_cache.json
          git add trade_log.json earnings_cache.json
          git diff --staged --quiet || (
            git commit -m "chore: update trade log [skip ci]" &&
            git pull --rebase origin master &&
            git push
          )
