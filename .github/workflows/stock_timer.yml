name: Run Stock Bot

on:
  schedule:
    # Premarket: once at 8:45am ET
    #   EDT (Summer, Mar–Nov): UTC-4 → 8:45am + 4h = 12:45 UTC
    #   EST (Winter, Nov–Mar): UTC-5 → 8:45am + 5h = 13:45 UTC
    - cron: '45 12 * * 1-5'
    - cron: '45 13 * * 1-5'

    # Intraday: every hour at :30, covering 9:30am–2:30pm ET
    #   EDT (Summer): 9:30am = 13:30 UTC, 2:30pm = 18:30 UTC
    #   EST (Winter): 9:30am = 14:30 UTC, 2:30pm = 19:30 UTC
    #   13-19 UTC as wide net safely covers both seasons
    - cron: '30 13-19 * * 1-5'

    # Power Hour: every 15 min, 3:00–4:00pm ET
    #   EDT (Summer): 3pm = 19:00 UTC, 4pm = 20:00 UTC
    #   EST (Winter): 3pm = 20:00 UTC, 4pm = 21:00 UTC
    #   19-21 UTC as wide net safely covers both seasons
    - cron: '*/15 19-21 * * 1-5'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          DISCORD_URL: ${{ secrets.DISCORD_URL }}
        run: python stock_bot.py
