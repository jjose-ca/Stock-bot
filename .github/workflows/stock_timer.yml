name: Run Stock Bot

on:
  schedule:
    # Runs hourly from 9:00 AM to 4:00 PM EST (Mon-Fri)
    # 14:00 UTC = 9:00 AM EST
    # 21:00 UTC = 4:00 PM EST (Alert arrives ~4:02 PM)
    - cron: '11 14-21 * * 1-5'
  workflow_dispatch: # Allows you to click a button to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          # This connects to the Secret you made earlier
          DISCORD_URL: ${{ secrets.DISCORD_URL }}
        run: python stock_bot.py

