name: Run Stock Bot

on:
  schedule:
    # Premarket: once at 8:45am ET
    #   EDT (Summer, Mar–Nov): UTC-4 → 8:45am + 4h = 12:45 UTC
    #   EST (Winter, Nov–Mar): UTC-5 → 8:45am + 5h = 13:45 UTC
    - cron: '45 12 * * 1-5'
    - cron: '45 13 * * 1-5'

    # Intraday: every hour at :30, 9:30am–2:30pm ET (informational)
    #   EDT: 13:30–18:30 UTC | EST: 14:30–19:30 UTC
    - cron: '30 13-18 * * 1-5'

    # Power Hour: 3:00, 3:15, 3:30, 3:45pm ET only
    # 4:00pm removed — market closed, bot has hard stop at elapsed >= 390min

    # EDT (Summer, Mar–Nov): UTC-4
    - cron: '0 19 * * 1-5'
    - cron: '15 19 * * 1-5'
    - cron: '30 19 * * 1-5'
    - cron: '45 19 * * 1-5'

    # EST (Winter, Nov–Mar): UTC-5
    - cron: '0 20 * * 1-5'
    - cron: '15 20 * * 1-5'
    - cron: '30 20 * * 1-5'
    - cron: '45 20 * * 1-5'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          DISCORD_URL: ${{ secrets.DISCORD_URL }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python stock_bot_updated.py

      - name: Commit trade log
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f trade_log.json ] || echo "[]" > trade_log.json
          [ -f earnings_cache.json ] || echo "{}" > earnings_cache.json
          git add trade_log.json earnings_cache.json
          git diff --staged --quiet || (
            git commit -m "chore: update trade log [skip ci]" &&
            git pull --rebase origin master &&
            git push
          )
