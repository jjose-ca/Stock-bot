name: Run Stock Bot

on:
  schedule:
    # Premarket: once at 8:45am ET
    #   EDT (Summer, Mar–Nov): UTC-4 → 8:45am + 4h = 12:45 UTC
    #   EST (Winter, Nov–Mar): UTC-5 → 8:45am + 5h = 13:45 UTC
    - cron: '45 12 * * 1-5'
    - cron: '45 13 * * 1-5'

    # Intraday: every hour at :30, 9:30am–2:30pm ET
    #   Using 14-18 UTC avoids overlap with premarket and power hour
    - cron: '30 14-18 * * 1-5'

    # Power Hour: every 15 min, 3:00–4:00pm ET
    #   EDT: 19:00–20:00 UTC | EST: 20:00–21:00 UTC
    - cron: '*/15 19-21 * * 1-5'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          DISCORD_URL: ${{ secrets.DISCORD_URL }}
        run: python stock_bot.py

      - name: Commit trade log
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Create empty log if bot never fired an alert this run
          [ -f trade_log.json ] || echo "[]" > trade_log.json
          git add trade_log.json
          # Only commit+push if the file actually changed.
          # Pull --rebase first to avoid rejection when concurrent runs
          # (e.g. 3:00pm and 3:15pm) both try to push at the same time.
          git diff --staged --quiet || (
            git pull --rebase origin master &&
            git commit -m "chore: update trade log [skip ci]" &&
            git push
          )
