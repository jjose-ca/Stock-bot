name: Run SOXL Swing Bot

on:
  #schedule:
    # SOXL swing bot runs 3 times in the final hour of the session.
    # This protects against GitHub Actions cron delays — if the 3:20pm
    # run is delayed to 3:38pm, the signal still fires before close.
    # The bot's duplicate guard (per-tranche dedup in soxl_trade_log.json)
    # ensures only one alert fires even if multiple runs detect the same setup.
    #
    # DST handled with dual UTC offsets (same pattern as tqqq_timer.yml):
    #   EDT (Mar-Nov): UTC-4  |  EST (Nov-Mar): UTC-5
    #
    # Target ET times: 3:20pm, 3:35pm, 3:45pm
    #   EDT -> 19:20, 19:35, 19:45 UTC
    #   EST -> 20:20, 20:35, 20:45 UTC

    # EDT offsets (March - November)
   # - cron: '20 19 * * 1-5'   # 3:20pm ET (EDT)
   # - cron: '35 19 * * 1-5'   # 3:35pm ET (EDT)
    #- cron: '45 19 * * 1-5'   # 3:45pm ET (EDT)

    # EST offsets (November - March)
   # - cron: '20 20 * * 1-5'   # 3:20pm ET (EST)
   # - cron: '35 20 * * 1-5'   # 3:35pm ET (EST)
  #  - cron: '45 20 * * 1-5'   # 3:45pm ET (EST)

  workflow_dispatch:
    inputs:
      force:
        description: 'Force scan even if outside entry window (testing)'
        required: false
        default: 'false'
        type: boolean
      dry_run:
        description: 'Dry run — skip trade log writes (testing)'
        required: false
        default: 'false'
        type: boolean

jobs:
  soxl_swing:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SOXL swing bot
        env:
          DISCORD_URL: ${{ secrets.DISCORD_URL }}
        run: |
          ARGS=""
          [ "${{ github.event.inputs.force }}"   = "true" ] && ARGS="$ARGS --force"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          python soxl_bot.py $ARGS

      - name: Commit trade log
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f soxl_trade_log.json ]     || echo "[]" > soxl_trade_log.json
          [ -f soxl_earnings_cache.json ] || echo "{}" > soxl_earnings_cache.json
          git add soxl_trade_log.json soxl_earnings_cache.json
          git diff --staged --quiet || (
            git commit -m "chore: update soxl swing trade log [skip ci]" &&
            git pull --rebase origin master &&
            git push
          )
